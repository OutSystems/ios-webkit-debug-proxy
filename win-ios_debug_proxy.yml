#ios_debug_proxy pipeline for getting libraries and binary

trigger: none

pool:
  vmImage: 'windows-latest'

pr: none
variables:
- name: exportLib 
  value: /Users/runner/exportedLibs.tar

steps:
####################################################################################################################
# START IOS_DEBUG_PROXY for win
####################################################################################################################
###################
# Install MSYS2
###################
- task: msys2/setup-msys2@v2 
  displayName: '✅ Installation of MSYS2'
- task: CmdLine@2
  displayName: 'pacman -Syu'
                                                                                             