#  inputs:
#    script: |
#      /tools/msys64/usr/bin/bash -c /
#      "PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:/opt/bin:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0/; export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig; export CONFIG_SITE=/mingw64/etc/config.site; export MSYSTEM=MINGW64; ./autogen.sh --no-configure-run; cd win32/installer_msys2; make all"
- task: CmdLine@2
  displayName: 'Install additional  tools'
  inputs:
    script: |
      /tools/msys2.exe /pacman -S mingw-w64-i686-gcc mingw-w64-i686-libtool mingw-w64-i686-pkg-config
      /tools/msys2.exe /pacman -S automake-wrapper autoconf make unzip patch
      /tools/msys2.exe /wget https://github.com/openssl/openssl/archive/OpenSSL_1_1_1.zip -O openssl.zip

    



