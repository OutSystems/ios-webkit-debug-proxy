#ios_debug_proxy pipeline for getting libraries and binary

trigger: none

pool:
  vmImage: 'windows-latest'

variables:
- name: CMD 
  value: 'cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c'
  
steps:
- task: PowerShell@2
  displayName: '🛠️ MSYS2 installation'
  inputs:
    targetType: 'inline'
    script: |
      cd MSYS_install
      .\install.ps1
      "PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:/opt/bin:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0/; export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig; export CONFIG_SITE=/mingw64/etc/config.site; export MSYSTEM=MINGW64; ./autogen.sh --no-configure-run; cd win32/installer_msys2; make all"
- task: PowerShell@2
  displayName: '👀 see files'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64
      Get-ChildItem
- task: PowerShell@2
  displayName: '📥 Download projects'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64 
      mkdir C:\msys64\Location
      Set-Location C:\msys64\Location
      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libplist/archive/2.2.0.zip','C:\msys64\Location\libplist.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libusbmuxd/archive/2.0.2.zip','C:\msys64\Location\libusbmuxd.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/openssl/openssl/archive/OpenSSL_1_1_1.zip','C:\msys64\Location\openssl.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libimobiledevice/archive/1.3.0.zip','C:\msys64\Location\libimobiledevice.zip')
      (new-object System.Net.WebClient).DownloadFile('https://ftp.pcre.org/pub/pcre/pcre-8.43.zip','C:\msys64\Location\pcre.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/OutSystems/ios-webkit-debug-proxy/archive/outsystems.zip','C:\msys64\Location\ios-webkit-debug-proxy.zip')
- task: PowerShell@2
  displayName: '🧮 extract projects'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location
      Get-ChildItem *.zip | Expand-Archive -DestinationPath C:\msys64\Location\
      pwd
      Get-ChildItem 
- task: PowerShell@2
  displayName: '📦 liblist build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libplist-2.2.0\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'C:/msys64/Location/libplist-2.2.0/autogen.sh --without-cython'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make install -j4'
- task: PowerShell@2
  displayName: '📦 libusbmuxd build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libusbmuxd-2.0.2\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'wget https://raw.githubusercontent.com/Orbif/libimobiledevice-patchs/master/libimobiledevice-socket-mingw-compatibility.patch'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'patch -p 1 < libimobiledevice-socket-mingw-compatibility.patch'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'C:/msys64/Location/libusbmuxd-2.0.2/autogen.sh'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make install -j4'
- task: PowerShell@2
  displayName: '📦 openssl build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\openssl-OpenSSL_1_1_1\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c './Configure --prefix=/mingw32 no-idea no-mdc2 no-rc5 shared mingw'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make -j4'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make install_sw -j4'
- task: PowerShell@2
  displayName: '📦 libimobiledevice build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libimobiledevice-1.3.0\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'wget https://raw.githubusercontent.com/Orbif/libimobiledevice-patchs/master/libimobiledevice-socket-mingw-compatibility.patch'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'patch -p 1 < libimobiledevice-socket-mingw-compatibility.patch'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c './autogen.sh --without-cython'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make install -j4'
- task: PowerShell@2
  displayName: '📦 pcre build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\pcre-8.43\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c './configure'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make install -j4'
- task: PowerShell@2
  displayName: '📦 ios-webkit-debug-proxy-outsystems build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\ios-webkit-debug-proxy-outsystems\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c './autogen.sh'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make -j4'
###################
# Check that generated libs/dlls are there
################### 
- task: PowerShell@2
  displayName: '✅ installation check'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libplist-2.2.0\src\.libs\
      pwd
      Get-ChildItem libplist-2.0.dll
      Set-Location C:\msys64\Location\libusbmuxd-2.0.2\src\.libs\
      pwd
      Get-ChildItem libusbmuxd-2.0.dll
      Set-Location C:\msys64\Location\openssl-OpenSSL_1_1_1\
      pwd
      Get-ChildItem libcrypto-1_1.dll
      Get-ChildItem libssl-1_1.dll
      Set-Location C:\msys64\Location\libimobiledevice-1.3.0\src\.libs\
      Get-ChildItem libimobiledevice-1.0.dll
      Set-Location C:\msys64\Location\pcre-8.43\.libs\
      Get-ChildItem libpcre-1.dll
      Get-ChildItem libpcreposix-0.dll
      Set-Location C:\msys64\Location\ios-webkit-debug-proxy-outsystems\src\.libs\
      Get-ChildItem ios_webkit_debug_proxy.exe
      Set-Location C:\msys64\mingw32\bin\
      Get-ChildItem libgcc_s_dw2-1.dll
      Get-ChildItem libwinpthread-1.dll                                                                                                    