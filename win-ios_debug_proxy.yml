#ios_debug_proxy pipeline for getting libraries and binary

trigger: none

pool:
  vmImage: 'windows-latest'

variables:
- name: CMD 
  value: 'cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c'
  
steps:
- task: PowerShell@2
  displayName: '📥 Download projects'
  inputs:
    targetType: 'inline'
    script: 
      mkdir C:\msys64\Location
      Set-Location C:\msys64\Location
      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libplist/archive/2.2.0.zip','C:\msys64\Location\libplist.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/openssl/openssl/archive/OpenSSL_1_1_1.zip','C:\msys64\Location\openssl.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libusbmuxd/archive/2.0.2.zip','C:\msys64\Location\ibusbmuxd.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libimobiledevice/archive/1.3.0.zip','C:\msys64\Location\libimobiledevice.zip')
      (new-object System.Net.WebClient).DownloadFile('https://github.com/OutSystems/ios-webkit-debug-proxy/archive/outsystems.zip','C:\msys64\Location\ios-webkit-debug-proxy.zip')
      (new-object System.Net.WebClient).DownloadFile('https://ftp.pcre.org/pub/pcre/pcre-8.43.zip','C:\msys64\Location\pcre.zip')
- task: PowerShell@2
  displayName: 'Extract projects'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location
      Get-ChildItem *.zip | Expand-Archive
      Get-ChildItem
- task: PowerShell@2
  displayName: '🛠️ Instalation MSYS2'
  inputs:
    targetType: 'inline'
    script: |
      cd MSYS_install
      .\install.ps1
      "PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:/opt/bin:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0/; export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig; export CONFIG_SITE=/mingw64/etc/config.site; export MSYSTEM=MINGW64; ./autogen.sh --no-configure-run; cd win32/installer_msys2; make all"
- task: PowerShell@2
  displayName: '📦 liblist build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libplist\libplist-2.2.0\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'C:/msys64/Location/libplist/libplist-2.2.0/autogen.sh --without-cython'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make install -j4'
- task: PowerShell@2
  displayName: '📦 libusbmuxd build'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libusbmuxd \libusbmuxd-2.0.2\
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'C:/msys64/Location/libusbmuxd/libusbmuxd-2.0.2/autogen.sh --without-cython'
      C:\msys64\msys2_shell.cmd -defterm -mingw32 -no-start -full-path -here -c 'make install -j4'
- task: PowerShell@2
  displayName: 'Installation check'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libplist\libplist-2.2.0\src\.libs\
      pwd
      Get-ChildItem libplist-2.0.dll
      Set-Location C:\msys64\Location\libusbmuxd\libusbmuxd-2.0.2\src\.libs\
      pwd
      Get-ChildItem  libusbmuxd-2.0.dll                                                                                                