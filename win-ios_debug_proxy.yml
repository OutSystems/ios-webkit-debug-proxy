#ios_debug_proxy pipeline for getting libraries and binary

trigger: none

pool:
  vmImage: 'windows-latest'
steps:
#- script: 
#    choco install msys2
#  displayName: 'Setup MSYS2'
- task: CmdLine@2
  displayName: 'Install MSYS2'
  inputs:
    script: |
      choco install msys2 --params "/NoUpdate /InstallDir:/tools"
- task: CmdLine@2
  displayName: 'Check'
  inputs:
    script: |
      cd /tools/usr/bin
      pwd
      ls
