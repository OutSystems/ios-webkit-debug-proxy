#ios_debug_proxy pipeline for getting libraries and binary

trigger: none

pool:
  vmImage: 'windows-latest'

pr: none
variables:
- name: exportLib 
  value: /Users/runner/exportedLibs.tar

strategy:
  matrix:
    mingw-w64-i686-gcc:
      name: '32-bit OpenSSL and MQTT'

- task: CmdLine@2
  displayName: 'Install msys'
  inputs:
    script: |
      choco install msys2
                                                                                             