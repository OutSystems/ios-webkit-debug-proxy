#ios_debug_proxy pipeline for getting libraries and binary

trigger: none

pool:
  vmImage: 'windows-latest'
steps:
#- script: 
#    choco install msys2
#  displayName: 'Setup MSYS2'
- task: CmdLine@2
  displayName: 'Install MSYS2'
  inputs:
    script: |
      choco install msys2
- task: PowerShell@2
  displayName: 'Check'
  inputs:
    script: |
      pwd
      ls 
      cd /
      pwd
      ls 
      cd ~
      pwd
      ls
- task: CmdLine@2
  displayName: 'Setup MSYS2'
  inputs:
    script: |
      c:\tools\msys64\usr\bin\bash -c "PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:/opt/bin:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0/; bash scripts/azure_windows_x86_64_setup.sh"
- task: CmdLine@2
  displayName: 'Build'
  inputs:
    script: |
      c:\tools\msys64\usr\bin\bash -c \
      "PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:/opt/bin:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0/; export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig; export CONFIG_SITE=/mingw64/etc/config.site; export MSYSTEM=MINGW64; ./autogen.sh --no-configure-run; cd win32/installer_msys2; make all"
- task: CmdLine@2
  displayName: 'Install additional  tools'
  inputs:
    script: |
      pacman -S mingw-w64-i686-gcc mingw-w64-i686-libtool mingw-w64-i686-pkg-config
    



