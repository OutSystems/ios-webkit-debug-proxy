#ios_debug_proxy pipeline for getting libraries and binary

trigger: none

pool:
  vmImage: 'windows-latest'

variables:
- name: CMD 
  value: 'cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c'
  
steps:
- task: CmdLine@2
  displayName: 'Check cmd line'
  inputs:
    script: |
      ls
- task: PowerShell@2
  displayName: 'Instalation MSYS2'
  inputs:
    targetType: 'inline'
    script: |
      cd MSYS_install
      .\install.ps1
      "PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:/opt/bin:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0/; export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig; export CONFIG_SITE=/mingw64/etc/config.site; export MSYSTEM=MINGW64; ./autogen.sh --no-configure-run; cd win32/installer_msys2; make all"
#- task: PowerShell@2
#  displayName: 'Install additional  tools'
#  inputs:
#    targetType: 'inline'
#    script: |
#      cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c 'pacman -Syu'
#      cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c 'pacman -S mingw-w64-i686-gcc mingw-w64-i686-libtool mingw-w64-i686-pkg-config'      
#      cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c 'pacman -S automake-wrapper autoconf make unzip patch'
- task: PowerShell@2
  displayName: 'See files'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64
      Get-ChildItem
- task: PowerShell@2
  displayName: 'Download projects'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64 
      mkdir C:\msys64\Location
      Set-Location C:\msys64\Location
      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libplist/archive/2.2.0.zip','C:\msys64\Location\libplist.zip')
#      (new-object System.Net.WebClient).DownloadFile('https://github.com/openssl/openssl/archive/OpenSSL_1_1_1.zip','D:\a\1\s\Location\openssl.zip')
#      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libusbmuxd/archive/2.0.2.zip','D:\a\1\s\Location\ibusbmuxd.zip')
#      (new-object System.Net.WebClient).DownloadFile('https://github.com/libimobiledevice/libimobiledevice/archive/1.3.0.zip','D:\a\1\s\Location\libimobiledevice.zip')
#      (new-object System.Net.WebClient).DownloadFile('https://github.com/OutSystems/ios-webkit-debug-proxy/archive/outsystems.zip','D:\a\1\s\Location\ios-webkit-debug-proxy.zip')
#      (new-object System.Net.WebClient).DownloadFile('https://ftp.pcre.org/pub/pcre/pcre-8.43.zip','D:\a\1\s\Location\pcre.zip')
- task: PowerShell@2
  displayName: 'Extract projects'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\
      pwd
      Get-ChildItem
      Set-Location C:\msys64\Location
      Get-ChildItem *.zip | Expand-Archive
      Get-ChildItem
- task: PowerShell@2
  displayName: 'First installation'
  inputs:
    targetType: 'inline'
    script: |
      Set-Location C:\msys64\Location\libplist-2.2.0\
      cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c './autogen.sh'
      cmd /c start /wait C:\msys64\usr\bin\sh.exe --login -c 'C:\msys64\mingw64\bin\mingw32-make.exe install j4'                                                                                                 