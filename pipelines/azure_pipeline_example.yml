#Comments
parameters:
- name: SomeParameter
  displayName: Choose parameter
  default: param1
  values:
  - param1
  - param2


#variables:
#- group: Variable group name

#Usage : $(var_name)

trigger: none

# no PR triggers
pr: none

stages:
#########################################################################
## Stage One
#########################################################################
  - stage: StageName
    displayName: 'Stage Display Name'
    jobs:
    - job: Job1
      displayName: 'Job1'
      pool:
        vmImage: 'ubuntu-20.04'
      steps:
          - task: CmdLine@2 
            displayName: 'Task 1'
            inputs:
                script: |
                    echo "job 1 - task 1" 
          - task: CmdLine@2 
            displayName: 'Task 2'
            inputs:
                script: |
                    echo "job 1 - task 2"            
    - job: Job2
      displayName: 'Job2'
      pool:
        vmImage: 'ubuntu-20.04'
      steps:
          - task: CmdLine@2 
            displayName: 'Task 1'
            inputs:
                script: |
                    echo "job 2 - task 1" 
          - task: CmdLine@2 
            displayName: 'Task 2'
            inputs:
                script: |
                    echo "job 2 - task 2"       