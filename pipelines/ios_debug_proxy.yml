#Comments
parameters:
- name: SomeParameter
  displayName: Choose parameter
  default: param1
  values:
  - param1
  - param2


#variables:
#- group: Variable group name

#Usage : $(var_name)

trigger: none

# no PR triggers
pr: none

stages:
#########################################################################
## Stage One
#########################################################################
  - stage: StageName
    displayName: 'Stage for ios debug build'
    jobs:
    - job: Job1
      displayName: 'Job1'
      pool:
        vmImage: 'macOS-latest'
      steps:
          - task: CmdLine@2 
            displayName: 'Check Correct architecture'
            inputs:
                script: |
                    arch 
          - task: CmdLine@2 
            displayName: 'Check if Homebrew is installed'
            inputs:
                script: |
                    brew help            
